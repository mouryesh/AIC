# Generated by demo/make_plant_export.py -- a stand-in for a real plant export.
# Column names on the left are the PLANT's; RippleTwin's code never changes.
plant_name: "Synthetic Assembly Plant (demo export)"

line:
  takt_s: 60.0
  n_stations: 42
  clock_sync_s: 0.5
  # Every station in process order, instrumented or not. A plant can answer
  # this from its equipment list; the blind ones simply never appear in the
  # historian. Without it the twin has to guess where the gaps are.
  stations:
    - EQ-000
    - EQ-001
    - EQ-002
    - EQ-003
    - EQ-004
    - EQ-005
    - EQ-006
    - EQ-007
    - EQ-008
    - EQ-009
    - EQ-010
    - EQ-011
    - EQ-012
    - EQ-013
    - EQ-014
    - EQ-015
    - EQ-016
    - EQ-017
    - EQ-018
    - EQ-019
    - EQ-020
    - EQ-021
    - EQ-022
    - EQ-023
    - EQ-024
    - EQ-025
    - EQ-026
    - EQ-027
    - EQ-028
    - EQ-029
    - EQ-030
    - EQ-031
    - EQ-032
    - EQ-033
    - EQ-034
    - EQ-035
    - EQ-036
    - EQ-037
    - EQ-038
    - EQ-039
    - EQ-040
    - EQ-041

time_scale: 1.0

files:
  states: plc_state_log.csv
  scans: vin_scans.csv
  vehicles: build_sequence.csv
  inspections: gate_results.csv

columns:
  states:
    Equipment: station
    StateCode: state
    EventTime: t_s
  scans:
    Equipment: station
    SerialNo: vehicle_id
    ReadTime: t_s
  vehicles:
    SerialNo: vehicle_id
    ModelCode: variant
    ShiftName: shift
  inspections:
    SerialNo: vehicle_id
    GateCode: gate_id
    Result: result
    DefectCodes: defect_types
